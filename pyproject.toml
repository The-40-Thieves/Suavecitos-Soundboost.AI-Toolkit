[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suavecitos-soundboost-toolkit"
version = "1.1.0"
description = "Master, split, tag, and ship your tracks from the terminal, your AI agent, or REAPER. Unofficial CLI + MCP server for SoundBoost.ai, built with their permission."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Suavecito", email = "suavecito585@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastmcp>=4.1.3,<5",
    "fastmcp-tasks>=4.1.3,<5",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1,<1",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydantic>=2.14.1,<3",
    "numpy>=2.5.4,<3",
    "scipy>=1.18.1,<2",
    "soundfile>=0.14.0",
    "mutagen>=1.48.1",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
video = [
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
]

[project.scripts]
soundboost = "soundboost_toolkit.cli:app"
soundboost-mcp = "soundboost_toolkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soundboost_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = [
    "E501",   # long docstrings/endpoint tables are intentional
    "S101",   # asserts are used in tests
    "S603",   # subprocess calls use fixed argument lists
    "S607",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["soundboost_toolkit"]
