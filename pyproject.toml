[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suavecitos-soundboost-toolkit"
version = "1.0.0"
description = "Suavecito's Soundboost.AI Toolkit — Unified CLI, FastMCP Server, Cryptographic Protocol Client, ITU-R BS.1770-4 DSP Engine, and REAPER JSFX/ReaScript Suite for SoundBoost.ai (Diktatorial Suite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Suavecito", email = "suavecito585@users.noreply.github.com" }
]
dependencies = [
    "fastmcp>=4.1.3",
    "fastmcp-tasks>=4.1.3",
    "mcp>=2.3.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "mutagen>=1.47.0",
    "keyring>=25.0.0",
]

[project.scripts]
soundboost = "soundboost_toolkit.cli:app"
soundboost-mcp = "soundboost_toolkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soundboost_toolkit*"]
