name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install system audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install locked dependencies
        # Wheels only, from uv.lock; the project itself is imported from the checkout.
        run: uv sync --locked --no-build --no-install-project --extra video --extra dev
      - name: Put the venv on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$GITHUB_WORKSPACE/.venv/Scripts"; else echo "$GITHUB_WORKSPACE/.venv/bin"; fi >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
      - name: Dependency audit
        run: pip-audit --skip-editable
